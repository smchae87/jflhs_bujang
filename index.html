var FOLDER_ID = "1d30vy1maOhEZl1TtdXDaUjkm8ISN2BEm";
var DB_FILE_NAME = "jinju_meetings_database.json";

function doGet(e) {
  try {
    var meetings = getMeetingsFromDb();
    return ContentService.createTextOutput(JSON.stringify({
      success: true,
      meetings: meetings
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      success: false,
      error: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    var rawData = e.postData ? e.postData.contents : "{}";
    var payload = JSON.parse(rawData);
    var action = payload.action || "save_meeting";
    var folder = DriveApp.getFolderById(FOLDER_ID);
    
    // 1. 전체 동기화 (sync_all)
    if (action === "sync_all") {
      var allMeetings = payload.meetings || [];
      saveMeetingsToDb(allMeetings);
      return ContentService.createTextOutput(JSON.stringify({
        success: true,
        count: allMeetings.length
      })).setMimeType(ContentService.MimeType.JSON);
    }
    
    // 2. 단일 회의 삭제 (delete_meeting)
    if (action === "delete_meeting") {
      var meetingId = payload.meetingId;
      var currentList = getMeetingsFromDb();
      var filtered = currentList.filter(function(m) { return m.id !== meetingId; });
      saveMeetingsToDb(filtered);
      return ContentService.createTextOutput(JSON.stringify({
        success: true,
        meetings: filtered
      })).setMimeType(ContentService.MimeType.JSON);
    }
    
    // 3. 단일 회의 저장 및 구글 문서 자동 생성 (save_meeting) - 스마트 부서 병합 적용
    var meeting = payload.meeting || payload;
    var createDoc = (payload.createDoc !== false); // 기본값: 문서 생성
    var generatedDocUrl = meeting.docUrl || "";
    var generatedDocId = "";
    
    // 중앙 DB 목록 업데이트 (다중 사용자 동시 편집 충돌 및 덮어쓰기 방지)
    var meetingsList = getMeetingsFromDb();
    var existingIndex = -1;
    for (var i = 0; i < meetingsList.length; i++) {
      if (meetingsList[i].id === meeting.id || (meetingsList[i].date && meetingsList[i].date === meeting.date)) {
        existingIndex = i;
        break;
      }
    }
    
    if (existingIndex >= 0) {
      var existingMeeting = meetingsList[existingIndex];
      var existingDeptsMap = {};
      (existingMeeting.departments || []).forEach(function(d) {
        existingDeptsMap[d.department] = d;
      });
      
      var mergedDepts = (meeting.departments || []).map(function(newD) {
        var oldD = existingDeptsMap[newD.department];
        if (!oldD) return newD;
        
        var newContent = (newD.content || "").trim();
        var oldContent = (oldD.content || "").trim();
        var newHasContent = Boolean(newContent && newContent !== "없음" && newContent !== "전달사항 없음");
        var oldHasContent = Boolean(oldContent && oldContent !== "없음" && oldContent !== "전달사항 없음");
        
        // 1) 새로 작성한 내용이 있으면 새 내용 반영
        if (newHasContent) {
          return newD;
        }
        // 2) 새 내용은 비어있는데, 기존 DB에 이미 다른 선생님이 작성한 내용이 있다면 기존 내용 보존!
        else if (!newHasContent && oldHasContent) {
          if (newD.remarks && newD.remarks !== "미입력") {
            return {
              department: oldD.department,
              manager: newD.manager || oldD.manager,
              content: oldD.content,
              items: oldD.items || [],
              remarks: newD.remarks
            };
          }
          return oldD; // 다른 선생님의 소중한 입력 내용 완벽 보존!
        } else {
          return newD;
        }
      });
      
      meeting.departments = mergedDepts;
      meeting.id = existingMeeting.id; // 기존 canonical ID 유지
      meetingsList[existingIndex] = meeting;
    } else {
      meetingsList.unshift(meeting);
    }
    
    if (createDoc) {
      var docResult = createFormattedGoogleDoc(meeting, folder);
      generatedDocUrl = docResult.url;
      generatedDocId = docResult.id;
      meeting.docUrl = generatedDocUrl;
    }
    
    // 날짜 기준 내림차순 정렬
    meetingsList.sort(function(a, b) {
      return (b.date || "").localeCompare(a.date || "");
    });
    
    saveMeetingsToDb(meetingsList);
    
    return ContentService.createTextOutput(JSON.stringify({
      success: true,
      docUrl: generatedDocUrl,
      docId: generatedDocId,
      meetings: meetingsList
    })).setMimeType(ContentService.MimeType.JSON);
    
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      success: false,
      error: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

/**
 * 표준 양식 구글 문서(Google Docs) 자동 생성 함수
 * - 공식 서식 (맑은 고딕, 3단 표, 부서/전달사항/입력상황 색상 강조) 적용
 */
function createFormattedGoogleDoc(meeting, folder) {
  var cleanDate = (meeting.date || "").replace(/-/g, "");
  var titleText = meeting.meetingTitle || meeting.title || "진주외고 부장회의";
  var docFileName = (cleanDate ? cleanDate + " " : "") + titleText;
  
  var doc = null;
  var docFile = null;
  
  // 1. 기존에 생성된 문서가 있는지 확인 (ID 또는 폴더 내 파일명으로 검색)
  if (meeting.docUrl) {
    try {
      var match = meeting.docUrl.match(//d/([a-zA-Z0-9_-]+)/);
      if (match) {
        doc = DocumentApp.openById(match[1]);
        docFile = DriveApp.getFileById(match[1]);
      }
    } catch (e) {}
  }
  
  if (!doc) {
    var existingFiles = folder.getFilesByName(docFileName);
    if (existingFiles.hasNext()) {
      try {
        var existingFile = existingFiles.next();

        docFile = existingFile;

  // 2. 없으면 새로 생성 후 지정 폴더로 이동
  if (!doc) {

    docFile = DriveApp.getFileById(doc.getId());

    DriveApp.getRootFolder().removeFile(docFile);
  } else {
    doc.setName(docFileName);

  var body = doc.getBody();
  body.clear();
  body.setMarginTop(36);
  body.setMarginBottom(36);
  body.setMarginLeft(36);
  body.setMarginRight(36);

  var titleP = body.appendParagraph(titleText);
  titleP.setHeading(DocumentApp.ParagraphHeading.HEADING1);
  titleP.setAlignment(DocumentApp.HorizontalAlignment.CENTER);
  titleP.setFontFamily("Malgun Gothic");

  // (2) 일시 정보 (맑은 고딕 11pt 볼드)
  var dateStr = meeting.dateDisplay || meeting.date || "";
  var dateP = body.appendParagraph(dateStr);
  dateP.setAlignment(DocumentApp.HorizontalAlignment.CENTER);

  // (3) 3단 표 생성
  var table = body.appendTable();
  
  // 헤더 행 (부서 / 전달사항 / 입력 상황)

  var h2 = headerRow.appendTableCell("전달사항");
  var h3 = headerRow.appendTableCell("입력 상황");
  
  [h1, h2, h3].forEach(function(cell) {
    cell.setBackgroundColor("#F2F2F2");
    cell.setPaddingTop(6);
    cell.setPaddingBottom(6);
    cell.setPaddingLeft(6);
    cell.setPaddingRight(6);
    var p = cell.getChild(0).asParagraph();
    p.setAlignment(DocumentApp.HorizontalAlignment.CENTER);
    p.setFontFamily("Malgun Gothic");
    p.setFontSize(10);
    p.setBold(true);
  });
  
  // 열 너비 지정 (부서: 95pt, 전달사항: 335pt, 입력상황: 65pt)
  table.setColumnWidth(0, 95);
  table.setColumnWidth(1, 335);
  table.setColumnWidth(2, 65);
  
  // 부서별 내용 행 추가
  var depts = meeting.departments || [];
  if (depts.length === 0) {
    depts = [
      { department: "교무기획부", manager: "손대원", content: "", remarks: "미입력" },
      { department: "교육과정부", manager: "채선미", content: "", remarks: "미입력" },
      { department: "정보환경부", manager: "이덕귀", content: "", remarks: "미입력" },

    // [1열: 부서명 및 담당자]

/**

 */
function getMeetingsFromDb() {
  try {
    var folder = DriveApp.getFolderById(FOLDER_ID);
    var files = folder.getFilesByName(DB_FILE_NAME);
    while (files.hasNext()) {
      var file = files.next();
      try {
        var content = file.getBlob().getDataAsString("UTF-8");
        if (content && content.trim().indexOf("[") === 0) {
          var parsed = JSON.parse(content);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (err) {}
    }
  } catch (e) {}
  return [];
}

    // 기존 손상된 파일이나 PDF 파일 정리
    while (files.hasNext()) {
      var oldFile = files.next();
      try {
        oldFile.setTrashed(true);
      } catch (e) {}
    }
    
    // 깨끗한 새 JSON DB 파일로 생성
    folder.createFile(DB_FILE_NAME, jsonString, MimeType.PLAIN_TEXT);
  } catch (e) {}

  - 교육과정 연수(8월14일)에서 장학사님 당부 말씀
   ① 초중등교육법, 교육부.경상남도교육청 고시 등에 있는 관련 법령,고시, 지침은 "반드시" 준수

   ③ 위계/순서 확인 방법: 과목별 교육과정 각론에 있는 "교과별 성격, 목표" 반드시 확인

              -학생부교과전형(교과지만 학생부 봄, 정성평가)+학생부종합전형(종합이지만 교과도 중요) 
              -따라서, 내신+수능최저+학생부+면접 / 4가지 모두 준비하고 대비해야 함.
                (ex) 서울대: 수시·정시 모두 학생부 중심 + 정시 교과역량평가 40% 강화, 
                       수시 학교장추천인원 3명, 수시 지역균형(일반고만 가능, 수능최저 없어지고 서류, 면접으로만 선발), 정시 지역균형 전형은 2028부터 폐지
                ☞ 내신 1등급대 + 전공 연계 과목 이수 + 깊이 있는 세특 + SNU 역량평가 면접 대비 + 정시를 생각해도 교과 성적·세특 필수
                 (ex) 경희대: 수시·정시 모두에서 학생부 활용을 넓힘
-따라서, 크게는 수능최저기준 강화 + 교과 정성평가 확대 = 수시의 정시화, 정시의 수시화, 종합의 세분화로 보임 
              -내년에는 수업도 수능 중심, 방과후 수업도 수능 중심으로 진행되야 할 것 같음. 최저를 통과할 수 있는 방과후 활동이 필요함.(현재 1,2학년의 경우 내신 1등급 학생 10%를 체계적으로  관리하고 운영해야 함.)
-우수공기업 지역인재 채용 기조 유지중 - 지역 대학 관련학과 진학을 염두해 두는 전략도 필요 (ex) 전남지역 우수학생들 전남대 전기공학과 인기 - 한전)
